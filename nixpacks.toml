providers = ["node"]

[phases.setup]
aptPkgs = ["python3", "python3-venv", "python3-pip", "gcc", "g++", "make"]
nixPkgs = ["nodejs_22"]

[variables]
PYTHONUNBUFFERED = "1"
PYTHON_PORT = "8181"
NODE_ENV = "production"
PYTHON_ENGINE_URL = "http://127.0.0.1:8181"

[phases.install]
cmds = [
    "npm install --no-audit --prefer-offline --no-fund --legacy-peer-deps",
    "python3 -m venv /app/venv || python3 -m venv ./venv || true",
    "(/app/venv/bin/pip install --upgrade pip && /app/venv/bin/pip install -r python-engine/requirements.txt) || (./venv/bin/pip install -r python-engine/requirements.txt) || true",
    "chmod +x ops/start.sh || true"
]

[phases.build]
cmds = [
    "npm run build",
    "rm -rf server.pid pyenv python-engine/venv python-engine/__pycache__ patch.sh fix.sh"
]
cacheDirectories = ["node_modules/.cache", ".next/cache", "/root/.npm", "/root/.cache/pip"]

[start]
cmd = "bash ops/start.sh"
