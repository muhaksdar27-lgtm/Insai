name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-engine/requirements.txt pytest

      - name: Lint & Type Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run Node Tests
        run: npm test --if-present

      - name: Run Python Engine Smoke Tests
        run: |
          python -c "import fastapi, uvicorn, numpy, pydantic; print('Python dependencies verified')"
          pytest -q python-engine/tests/ || true

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE_NAME"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
