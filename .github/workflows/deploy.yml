name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate Required Secrets
        run: |
          echo "Validating Railway deployment secrets..."
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "❌ ERROR: RAILWAY_TOKEN secret is not set"
            echo "Please add RAILWAY_TOKEN to GitHub Secrets"
            echo "1. Go to Settings > Secrets and Variables > Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: RAILWAY_TOKEN"
            echo "4. Value: Your Railway API token from https://railway.app/account/tokens"
            exit 1
          fi
          if [ -z "${{ secrets.RAILWAY_SERVICE_NAME }}" ]; then
            echo "❌ ERROR: RAILWAY_SERVICE_NAME secret is not set"
            echo "Please add RAILWAY_SERVICE_NAME to GitHub Secrets"
            echo "1. Go to Settings > Secrets and Variables > Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: RAILWAY_SERVICE_NAME"
            echo "4. Value: Insai (the Railway service name)"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: |
          echo "Deploying to Railway service: ${{ secrets.RAILWAY_SERVICE_NAME }}"
          railway up --service "${{ secrets.RAILWAY_SERVICE_NAME }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        timeout-minutes: 15

      - name: Verify Deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 10
          echo "Deployment complete. Monitor at: https://railway.app/dashboard"
        continue-on-error: true

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed. Please check:"
          echo "1. RAILWAY_TOKEN is valid (not expired)"
          echo "2. Service name '${{ secrets.RAILWAY_SERVICE_NAME }}' exists in Railway project"
          echo "3. Build succeeded without errors"
          echo "4. Check Railway dashboard: https://railway.app/dashboard"
          exit 1

